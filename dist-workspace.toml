[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Beside the README and LICENSE that every archive gets: the crates' licence notices
# (scripts/third-party.sh)
include = ["THIRD-PARTY-NOTICES.txt"]
# The desktop apps in every release (.github/workflows/build-*-app.yml): the Mac app,
# signed and notarized; the Windows app; the Linux app
global-artifacts-jobs = ["./build-mac-app", "./build-windows-app", "./build-linux-app"]
# dist's notes list only its own files: put the apps on top (.github/workflows/app-notes.yml)
post-announce-jobs = ["./app-notes"]

# GitHub retires the macos-14 runner (dist's default for Apple Silicon) on 2026-11-02
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"
