[package]
name = "strata-zero"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "strata"
path = "src/main.rs"

[dependencies]
unicode-width.workspace = true
citygen = { path = "../citygen" }
game = { path = "../game" }
sim = { path = "../sim" }
serde.workspace = true
postcard.workspace = true
serde_json.workspace = true
rmp-serde.workspace = true
flate2.workspace = true
anyhow.workspace = true
ratatui.workspace = true
crossterm.workspace = true
clap.workspace = true
ron.workspace = true
thiserror.workspace = true
winit = { version = "0.30", optional = true }
softbuffer = { version = "0.4", optional = true }
fontdue = { version = "0.9", optional = true }
ab_glyph = { version = "0.2", optional = true }
png = { version = "0.18", optional = true }
wgpu = { version = "30", optional = true }
pollster = { version = "1", optional = true }
bytemuck = { version = "1", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", optional = true, features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
# The Windows app's icon and version information (build.rs).
winresource = { version = "0.1", optional = true }

[features]
# The game in its own window instead of a terminal: `strata --window`.
window = ["dep:winit", "dep:softbuffer", "dep:fontdue", "dep:ab_glyph", "dep:png", "dep:wgpu", "dep:pollster", "dep:bytemuck"]
# The desktop app (Strata Zero.app, Strata Zero.exe, the Linux strata-zero): always in
# the window, with its files in the player's app folder. On Windows it is a GUI program
# with an icon, showing fatal errors in a message box.
app = ["window", "dep:winresource", "dep:windows-sys"]

# dist leaves out crates with `publish = false` unless told otherwise; this one is the
# game it releases.
[package.metadata.dist]
dist = true

[dev-dependencies]
rmpv.workspace = true
