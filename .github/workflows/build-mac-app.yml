# Builds Strata Zero.app, the game in its own window, for Apple Silicon and Intel; signs
# it with the Developer ID in the repository's secrets; wraps it in a DMG; notarizes and
# staples that; and hands it to the release as the artifact `artifacts-mac-app`, which
# dist's host job attaches to the GitHub Release.
#
# Each secret reaches only the step that needs it, and the build runs before any of
# them, so no dependency's build script sees one or finds the keychain unlocked.
#
# dist's release.yml calls this for every release (`global-artifacts-jobs` in
# dist-workspace.toml); after changing that file, run `dist generate`.
#
# Secrets (docs/development.md, "Signing the Mac app"): MACOS_CERTIFICATE, MACOS_CERTIFICATE_PASSWORD,
# APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER. Without them the release fails here,
# unless the repository variable MAC_APP_UNSIGNED is 1: then the app is signed ad hoc.
name: Mac app

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  mac-app:
    runs-on: macos-latest
    env:
      STRATA_REQUIRE_SIGNING: ${{ vars.MAC_APP_UNSIGNED == '1' && '0' || '1' }}
      HAVE_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Rust for both Mac targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build the app
        run: scripts/macos-app.sh
      - name: The Developer ID, in a keychain of its own
        if: env.HAVE_CERTIFICATE == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -base64 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
          if [ -z "$identity" ]; then
            echo "::error::MACOS_CERTIFICATE holds no Developer ID Application identity"
            exit 1
          fi
          echo "STRATA_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Sign, wrap in a DMG, notarize and staple
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: scripts/macos-package.sh
      - uses: actions/upload-artifact@v7
        with:
          name: artifacts-mac-app
          path: target/smoke/macos/strata-zero-mac-app.dmg
          if-no-files-found: error
