# Builds Strata Zero for Windows, the game in its own window (the `app` feature), into
# strata-zero-windows-app.zip with scripts/windows-app.sh, and hands it to the release as
# the artifact `artifacts-windows-app`, which dist's host job attaches to the GitHub
# Release. The exe isn't signed yet, so SmartScreen asks once; the release notes say so.
#
# dist's release.yml calls this for every release (`global-artifacts-jobs` in
# dist-workspace.toml); after changing that file, run `dist generate`.
name: Windows app

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  windows-app:
    # The runner dist builds the terminal game for Windows on.
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      # Content and tests read text files byte for byte; keep Windows from adding CRs.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build the app
        run: scripts/windows-app.sh
      - uses: actions/upload-artifact@v7
        with:
          name: artifacts-windows-app
          path: target/smoke/windows/strata-zero-windows-app.zip
          if-no-files-found: error
