# Puts the desktop apps (Mac, Windows, Linux) at the top of the release notes once dist
# has published the release. dist's notes list only the files dist builds, so the apps
# from the build-*-app.yml jobs would otherwise go unmentioned. The work is
# scripts/app-notes.sh, which can also be run by hand for an older release.
#
# dist's release.yml calls this after announcing (`post-announce-jobs` in
# dist-workspace.toml); after changing that file, run `dist generate`.
name: App notes

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  notes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      MAC_APP_UNSIGNED: ${{ vars.MAC_APP_UNSIGNED }}
      TAG: ${{ fromJson(inputs.plan).announcement_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Link the apps in the release notes
        run: scripts/app-notes.sh "$TAG"
